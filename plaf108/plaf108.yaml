# Petlibro PLAF108 Cat Feeder - Full Configuration
# This file includes the common PLAF108 package and adds device-specific overrides

substitutions:
  device_name: "cat-feeder"
  friendly_name: "Cat Feeder"
  timezone: "America/Toronto"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false

# Include the full common configuration
packages:
  plaf108_common: !include .common.plaf108.yaml

# Override home-specific settings
wifi:
  domain: !secret domain
  ap:
    ssid: "Cat Feeder Setup"
    password: !secret fallback_wifi_password

ota:
  - id: !extend ota_default
    password: !secret ota_password

# Override timezone to Toronto
time:
  - id: !extend my_time
    timezone: ${timezone}
